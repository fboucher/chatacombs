# Chatacombs: zero-effort local startup.
#   docker compose up -d --build
#   curl http://localhost:8080/health
#
# Values below are samples. Put real secrets in a .env file next to this one
# (see .env.example); compose substitutes ${VAR} from it automatically.
services:
  chatacombs:
    build: .
    image: chatacombs:latest
    container_name: chatacombs
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      # Bearer token your chat bot sends on every /api/v1 call
      API_KEY: ${API_KEY:-change-me-bot-secret}
      # Read-only key used in the OBS overlay URL (?key=...)
      OVERLAY_KEY: ${OVERLAY_KEY:-change-me-overlay-secret}
      # Name viewers @mention to ask the narrator questions (e.g. "@Bones what's in the chest?")
      BOT_NAME: ${BOT_NAME:-Bones}
      # Link the bot posts when chat asks "Bones help" (defaults to the players guide on GitHub)
      HELP_URL: ${HELP_URL:-}
      # Port the service listens on inside the container
      PORT: ${PORT:-8080}
      # Optional OpenAI-compatible AI narrator; leave empty to use built-in template text.
      # For a model on this computer use host.docker.internal, not localhost (that's the container).
      AI_URL: ${AI_URL:-}
      AI_KEY: ${AI_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      # Milliseconds to wait for the AI before using built-in text
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-10000}
      # SQLite file inside the mounted volume
      DATABASE_PATH: /data/chatacombs.db
    # Lets the container reach services on this computer as host.docker.internal
    # (built into Docker Desktop; this line makes it work on Linux too)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dungeon-data:/data

volumes:
  dungeon-data:
